# Default values for todo-app
preview:
  enabled: false
  PRNumber: ""
  commitID: ""

# Kind exposes Istio through localhost; preview hosts use sslip.io for wildcard DNS.
istioLoadBalancerIP: "127.0.0.1"

image:
  pullPolicy: IfNotPresent

replicaCount: 2

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

resources:
  limits:
    cpu: 200m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi
